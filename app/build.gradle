apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

group = 'com.artifex.mupdf'
version = '1.27.1a'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newInputStream())

dependencies {
	if (file('../lib/build.gradle').isFile())
		api project(':lib')
	else
		api 'com.artifex.mupdf:viewer:1.27.1a'

	// Compose
	def compose_version = "1.5.0"
	implementation "androidx.compose.ui:ui:$compose_version"
	implementation "androidx.compose.material3:material3:1.1.1"
	implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
	implementation "androidx.lifecycle:lifecycle-runtime-compose:2.6.1"
	implementation "androidx.activity:activity-compose:1.7.2"

	// HTTP + coroutines for AI API
	implementation "com.squareup.okhttp3:okhttp:4.12.0"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
	implementation "androidx.lifecycle:lifecycle-runtime:2.6.1"
	implementation "androidx.savedstate:savedstate:1.2.1"
}

android {
	namespace 'com.artifex.mupdf.viewer.app'
	compileSdkVersion 34
	defaultConfig {
		minSdkVersion 24
		targetSdkVersion 35
		versionName '1.27.1a'
		versionCode 210
	}

	buildFeatures {
		compose true
		buildConfig true
	}
	composeOptions {
		kotlinCompilerExtensionVersion '1.5.1'
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = '17'
	}

	splits {
		abi {
			enable true
			universalApk true
		}
	}

	bundle {
		abi {
			enableSplit true
		}
	}

	if (project.hasProperty('release_storeFile')) {
		signingConfigs {
			release {
				storeFile file(release_storeFile)
				storePassword release_storePassword
				keyAlias release_keyAlias
				keyPassword release_keyPassword
			}
		}
		buildTypes {
			release {
				signingConfig signingConfigs.release
				ndk {
					debugSymbolLevel 'FULL'
				}
			}
		}
	}
}
